server:
  port: 8080

spring:
  application:
    name: idempotency-demo
  datasource:
    url: jdbc:h2:mem:idempotency;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# How long a completed idempotency record is kept before it can be reused (informational,
# cleanup job not included in this demo - see README for notes on production hardening)
idempotency:
  record-ttl-hours: 24
